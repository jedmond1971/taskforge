name: Cleanup orphaned attachments

on:
  schedule:
    - cron: "0 8 * * *" # daily at 08:00 UTC
  workflow_dispatch: {}

jobs:
  cleanup:
    name: Call cleanup endpoint
    runs-on: ubuntu-latest

    steps:
      # This repo is public, so this job's log is too. Print only the HTTP status:
      # never the response body. `curl -f` used to hide the status entirely, which
      # left a run of 401s/500s indistinguishable in the log.
      - name: POST /api/internal/cleanup-orphaned-attachments
        env:
          V1_API_KEY: ${{ secrets.V1_API_KEY }}
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' --max-time 90 -X POST \
            -H "X-Internal-Api-Key: ${V1_API_KEY}" \
            https://taskforge-production-099b.up.railway.app/api/internal/cleanup-orphaned-attachments) || status="000"
          echo "HTTP status: ${status}"
          if [ "${status}" != "200" ]; then
            echo "::error::Cleanup endpoint returned HTTP ${status} (401 = the V1_API_KEY repo secret does not match Railway's; 000 = no response)"
            exit 1
          fi
