name: Cleanup orphaned attachments

on:
  schedule:
    - cron: "0 8 * * *" # daily at 08:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: report what would be deleted, delete nothing"
        type: boolean
        default: true

jobs:
  cleanup:
    name: Call cleanup endpoint
    runs-on: ubuntu-latest

    steps:
      # This repo is public, so this job's log is too. Print only the HTTP status and a fixed
      # set of numeric fields picked out with jq, never the raw body: if the endpoint ever
      # grew a field carrying a file name, it would still not reach this log.
      #
      # Manual runs default to a dry run; the nightly schedule deletes for real.
      # 409 = the endpoint refused to delete (stopReason says why) and alerted the owner.
      - name: POST /api/internal/cleanup-orphaned-attachments
        env:
          V1_API_KEY: ${{ secrets.V1_API_KEY }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
        run: |
          url=https://taskforge-production-099b.up.railway.app/api/internal/cleanup-orphaned-attachments
          if [ "${DRY_RUN}" = "true" ]; then url="${url}?dryRun=1"; fi
          echo "Dry run: ${DRY_RUN}"
          body=$(mktemp)
          status=$(curl -s -o "${body}" -w '%{http_code}' --max-time 90 -X POST \
            -H "X-Internal-Api-Key: ${V1_API_KEY}" "${url}") || status="000"
          echo "HTTP status: ${status}"
          # Numbers only, plus a stop reason from a fixed lowercase vocabulary: anything else prints "-".
          jq -r 'def n(f): (f | numbers) // "-";
            "scanned=\(n(.scanned)) candidates=\(n(.candidates)) wouldDelete=\(n(.wouldDelete)) deleted=\(n(.orphansDeleted)) stopReason=\((.stopReason | strings | select(test("^[a-z_]{1,40}$"))) // "none")"' \
            "${body}" 2>/dev/null | tr -cd 'A-Za-z0-9_= \n-' || true
          rm -f "${body}"
          if [ "${status}" != "200" ]; then
            echo "::error::Cleanup endpoint returned HTTP ${status} (401 = V1_API_KEY secret mismatch; 409 = refused to delete, see stopReason; 000 = no response)"
            exit 1
          fi
