# SECH-104: scheduled counterpart to the `Dependency audit` gate in ci.yml.
#
# The CI gate only sees advisories on the production tree, and only when someone
# opens a PR. This job runs weekly whether or not anyone pushes, covers dev
# dependencies too, and keeps the raw report and an SBOM as artifacts — the
# evidence SECH-123's release bundle needs.
#
# Failure notification rides on GitHub's built-in "scheduled workflow failed"
# email to the repository owner. Real alerting with a tested delivery path is
# SECH-117's job, not this one's.
name: Weekly dependency audit

on:
  schedule:
    - cron: "0 8 * * 1" # Mondays at 08:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  audit:
    name: Full audit and SBOM
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # `npm sbom` needs a resolved install tree; `npm audit` alone would not.
      - name: Install dependencies
        run: npm ci

      # Covers dev dependencies as well as production. A high/critical in the
      # build chain is a real supply-chain risk even though it never ships, and
      # this is the only place it gets looked at — but it fails a scheduled job
      # that emails the owner, never someone's merge.
      - name: Audit all dependencies
        id: audit
        continue-on-error: true
        run: node scripts/audit-gate.mjs --include-dev --report npm-audit.json

      - name: Generate CycloneDX SBOM
        if: always()
        run: npm sbom --sbom-format cyclonedx --omit=dev > sbom.cyclonedx.json

      - name: Upload audit report and SBOM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit
          path: |
            npm-audit.json
            sbom.cyclonedx.json
          if-no-files-found: warn
          retention-days: 90

      # Kept last so the artifacts above are always uploaded, including on a
      # red run — that report is exactly what you want when triaging the alert.
      - name: Fail if the audit found unaccepted advisories
        if: steps.audit.outcome == 'failure'
        run: |
          echo "::error::Weekly dependency audit failed — see the dependency-audit artifact."
          exit 1
