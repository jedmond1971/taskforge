name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  # SECH-85 / SECH-97: DB-backed cross-tenant authorization suite (src/integration).
  # Kept out of `npm test` (hermetic) and run here against a throwaway Postgres.
  integration:
    name: Integration (cross-tenant)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: taskforge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d taskforge_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Must be localhost: src/integration/setup.ts refuses to run against any other host.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/taskforge_test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Integration tests
        run: npm run test:integration

  # SECH-112: gitleaks over the full history of every fetched ref (all branches + tags),
  # not just the pushed commit range, so a secret committed on any branch is caught.
  # Findings are redacted in logs and in the report artifact (public repo).
  # Triaged false positives belong in .gitleaks.toml, each with a reason.
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git /repo --log-opts="--all" --config /repo/.gitleaks.toml \
            --redact --no-banner --verbose \
            --report-format json --report-path /repo/gitleaks-report.json

      - name: Upload redacted report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          if-no-files-found: ignore
